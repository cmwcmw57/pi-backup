# KSRC 4륜 독립조향 로버용 Nav2 파라미터.
#
# 두 가지가 일반 설정과 다르다:
#  1) 컨트롤러가 RPP 가 아니라 **MPPI (motion_model: Omni)** 다.
#     nav2_regulated_pure_pursuit_controller 는 differential/ackermann 용이라
#     (v, omega) 만 내고 스워브의 게걸음(vy)을 통째로 버린다.
#     MPPI 의 Omni 모션모델은 vy_max / vy_std 를 갖고 있어 vy 를 실제로 명령한다.
#  2) costmap 에 **인지 레이어가 없다** (static + inflation 만).
#     정적 맵은 경사·단차의 통행 불가 영역만 담는다. 로버의 실제 크기는
#     robot_radius=0.21m 로 별도 반영한다.

amcl:
  ros__parameters:
    use_sim_time: false      # 실제로는 안 쓴다 -- 브리지가 map->odom 을 항등으로 발행

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 50.0          # 시뮬 제어주기와 동일
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # 모래에서 슬립 때문에 느릴 수 있으므로 넉넉하게 준다
      required_movement_radius: 0.05
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.50

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      time_steps: 48                    # 48 * 0.02s = 0.96s 예측지평
      model_dt: 0.02                    # 50 Hz
      batch_size: 1000                  # 노트북 CPU.  기본 2000 은 무겁다
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: Omni                # <- 스워브.  DiffDrive/Ackermann 이 아니다
      vx_max: 0.30                      # v_max = w_noload * r = 0.318 m/s
      vx_min: -0.30                     # 후진 허용 (스워브는 대칭)
      vy_max: 0.20
      wz_max: 0.80
      vx_std: 0.10
      vy_std: 0.10
      wz_std: 0.30
      prune_distance: 1.0
      transform_tolerance: 0.1
      visualize: true                   # RViz 에 후보 궤적 표시
      regenerate_noises: true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.0              # 홀로노믹이므로 제약 없음
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic,
                PathAlignCritic, PathFollowCritic, PathAngleCritic, TwirlingCritic]
      # PreferForwardCritic 은 **뺐다** -- 스워브는 게걸음·후진이 전진과 동등하고,
      # 넣으면 굳이 몸을 돌려세우게 된다.
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true        # 후보 궤적 전체에서 실제 로버 크기 확인
        collision_cost: 1000000.0
        near_goal_distance: 0.5
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0               # 횡이탈 억제.  우리 목적이 경로추종이다
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 0.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        forward_preference: false       # 스워브: 전진 선호 없음
      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0              # 불필요한 제자리 회전 억제 (scrub 이 모래를 판다)

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.01
      # 휠베이스·트랙과 바퀴반경에서 계산한 외접 반경은 0.2090m (2026-10-03 실측 치수).
      # drivable_mask 의 0.16m 창은 지형 경사 측정 규모이지 로버 충돌 반경이 아니다.
      robot_radius: 0.21
      # MPPI CostCritic 의 consider_footprint 에는 명시적 다각형이 필요하다.
      # 이 팔각형의 내접 반경은 약 0.210m 로 실제 바퀴 외접원(0.209m)을 포함한다.
      footprint: "[[0.227, 0.0], [0.161, 0.161], [0.0, 0.227], [-0.161, 0.161], [-0.227, 0.0], [-0.161, -0.161], [0.0, -0.227], [0.161, -0.161]]"
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.24
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.01
      track_unknown_space: false
      robot_radius: 0.21
      footprint: "[[0.227, 0.0], [0.161, 0.161], [0.0, 0.227], [-0.161, 0.161], [-0.227, 0.0], [-0.161, -0.161], [0.0, -0.227], [0.161, -0.161]]"
      plugins: [static_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.24
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""        # 런치에서 넣는다

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.15
      use_astar: true
      allow_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    wait:
      plugin: nav2_behaviors/Wait
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 50.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.30, 0.20, 0.80]
    min_velocity: [-0.30, -0.20, -0.80]
    max_accel: [1.0, 1.0, 3.0]
    max_decel: [-1.0, -1.0, -3.0]
    odom_topic: /odom
    odom_duration: 0.1
